{% extends 'base.html' %}

{% block title %}إنشاء حساب - رواق{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">إنشاء حساب جديد</h2>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-mit-red w-100">تسجيل</button>
                    </form>
                    <hr>
                    <p class="text-center mb-0">لديك حساب بالفعل؟ <a href="{% url 'users:login' %}">تسجيل الدخول</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
