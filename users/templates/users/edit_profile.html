{% extends 'base.html' %}

{% block title %}تعديل الملف الشخصي - رواق{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">تعديل الملف الشخصي</h2>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <button type="submit" class="btn btn-mit-red w-100">حفظ التغييرات</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
