{% extends 'base.html' %}

{% block title %}حذف الحساب - رواق{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="neumorphic-card p-4 text-center">
                <i class="fas fa-exclamation-triangle fa-4x mb-3" style="color: #dc3545;"></i>
                <h2 class="mb-3">حذف الحساب</h2>
                <p class="text-muted mb-4">
                    هذا الإجراء لا يمكن التراجع عنه. سيتم حذف جميع بياناتك بشكل دائم.
                </p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">اكتب DELETE لتأكيد الحذف</label>
                        <input type="text" name="confirm" class="form-control text-center" required>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 rounded-pill">
                        <i class="fas fa-trash"></i> حذف الحساب نهائياً
                    </button>
                </form>
                
                <hr class="my-4">
                
                <a href="{% url 'users:profile' %}" class="text-decoration-none">
                    <i class="fas fa-arrow-right"></i> العودة إلى الملف الشخصي
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
