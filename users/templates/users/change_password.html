{% extends 'base.html' %}

{% block title %}تغيير كلمة المرور - رواق{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="neumorphic-card p-4">
                <h2 class="mb-4">تغيير كلمة المرور</h2>
                
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                        {% endif %}
                    </div>
                    {% endfor %}
                    
                    <div class="d-flex gap-3">
                        <button type="submit" class="btn btn-mit-red rounded-pill px-4">
                            تغيير كلمة المرور
                        </button>
                        <a href="{% url 'users:profile' %}" class="btn btn-secondary rounded-pill px-4">
                            إلغاء
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
