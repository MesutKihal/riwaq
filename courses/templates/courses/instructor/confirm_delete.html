{% extends 'base.html' %}

{% block title %}حذف {{ type }} - رواق{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body text-center p-5">
                    <i class="fas fa-exclamation-triangle fa-4x mb-3" style="color: var(--mit-red);"></i>
                    <h4 class="mb-3">تأكيد الحذف</h4>
                    <p class="mb-4">هل أنت متأكد من حذف "{{ object.title }}"؟</p>
                    <p class="text-danger mb-4">هذا الإجراء لا يمكن التراجع عنه!</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex justify-content-center gap-3">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash"></i> نعم، احذف
                            </button>
                            <a href="javascript:history.back()" class="btn btn-secondary">
                                <i class="fas fa-times"></i> إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
